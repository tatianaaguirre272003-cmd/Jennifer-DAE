<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest World</title>

<link rel="stylesheet" href="styles.css">

<style>
/* 🌿 BACKGROUND */
.forest-page {
    background: linear-gradient(to bottom, #99cfe9, #22c55e);
    margin: 0;
    overflow: hidden;
}

/* 🌲 MAIN CONTAINER */
#forestContainer {
    position: relative;
    height: 100vh;
    overflow: hidden;
}

/* 🌳 WORLD */
#forestWorld {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
}

/* 🌤 SKY */
#forestSky {
    position: absolute;
    top: 0;
    width: 100%;
    height: 40%;
    background: linear-gradient(to bottom, #bde0fe, transparent);
    z-index: 0;
    pointer-events: none;
}

/* 🌱 GROUND */
#ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 50%;
    background: #166534;
}

/* 🌿 PLANTS */
.plant {
    position: absolute;
    font-size: 30px;
}

/* 🌳 TREES */
.tree {
    position: absolute;
    font-size: 60px;
}

/* 🐾 ANIMALS */
.forest-animal {
    position: absolute;
    font-size: 2.5rem;
    cursor: pointer;
    z-index: 5;
}

/* 🎮 CONTROLS */
.controls-panel {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 9999;
}

button {
    pointer-events: auto;
    margin: 2px;
    cursor: pointer;
}

/* 📢 STATUS MESSAGE */
#statusMessage {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    color: white;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 16px;
    opacity: 0;
    transition: 0.3s;
    z-index: 10000;
}

#statusMessage.show {
    opacity: 1;
}
</style>
</head>

<body class="forest-page">

<div id="forestContainer">

    <div id="forestSky"></div>
    <div id="ground"></div>

    <!-- 🌲 WORLD -->
    <div id="forestWorld"></div>

    <!-- 📢 UI -->
    <div id="statusMessage">Welcome to the Forest</div>

</div>

<!-- 🎮 CONTROLS -->
<div class="controls-panel">

    <h3>Forest Animals</h3>
    <button onclick="addForestAnimal('deer')">🦌</button>
    <button onclick="addForestAnimal('fox')">🦊</button>
    <button onclick="addForestAnimal('rabbit')">🐇</button>
    <button onclick="addForestAnimal('bear')">🐻</button>

    <h3>Flying Creatures</h3>
    <button onclick="addForestAnimal('eagle')">🦅</button>
    <button onclick="addForestAnimal('owl')">🦉</button>
    <button onclick="addForestAnimal('butterfly')">🦋</button>
    <button onclick="addForestAnimal('bee')">🐝</button>

    <h3>Environment</h3>
    <button onclick="addPlants()">🌿 Plants</button>
    <button onclick="addTrees()">🌳 Trees</button>

    <a href="index.html">Exit</a>

</div>

<script>
let forestAnimals = [];
let speed = 1;

const FOREST = {
    deer:'🦌', fox:'🦊', rabbit:'🐇', bear:'🐻', wolf:'🐺',
    eagle:'🦅', owl:'🦉', butterfly:'🦋', bee:'🐝'
};

/* 📢 STATUS */
function showStatus(msg){
    const el = document.getElementById('statusMessage');
    el.innerText = msg;
    el.classList.add('show');
    setTimeout(()=> el.classList.remove('show'), 2000);
}

/* 🌿 PLANTS */
function addPlants(){
    const c = document.getElementById('forestWorld');

    for(let i=0;i<25;i++){
        let p = document.createElement('div');
        p.className = 'plant';
        p.innerHTML = ['🌿','🍀','🌱','🌸'][Math.floor(Math.random()*4)];
        p.style.left = Math.random()*100 + '%';
        p.style.top = (60 + Math.random()*35) + '%';
        c.appendChild(p);
    }
}

/* 🌳 TREES */
function addTrees(){
    const c = document.getElementById('forestWorld');

    for(let i=0;i<10;i++){
        let t = document.createElement('div');
        t.className = 'tree';
        t.innerHTML = ['🌳','🌲'][Math.floor(Math.random()*2)];
        t.style.left = Math.random()*100 + '%';
        t.style.top = (40 + Math.random()*30) + '%';
        c.appendChild(t);
    }
}

/* 🐾 ANIMALS */
function addForestAnimal(type){
    const c = document.getElementById('forestWorld');

    let el = document.createElement('span');
    el.className = 'forest-animal';
    el.innerHTML = FOREST[type];

    c.appendChild(el);

    let isFlying = ['eagle','owl','bee','butterfly'].includes(type);

    let a = {
        el,
        type,
        x: Math.random()*90,
        y: isFlying ? Math.random()*40 : 60 + Math.random()*30,
        vx: (Math.random()-0.5)*0.4,
        vy: (Math.random()-0.5)*0.2
    };

    forestAnimals.push(a);

    el.onclick = () => {
        a.vx *= 2;
        showStatus(`The ${type} is moving fast!`);
        setTimeout(()=> a.vx /= 2, 2000);
    };

    update(a);
    showStatus(`Added ${type}!`);
}

function update(a){
    a.el.style.left = a.x + '%';
    a.el.style.top = a.y + '%';
}

/* 🔁 LOOP */
setInterval(()=>{
    forestAnimals.forEach(a=>{

        a.x += a.vx * speed;
        a.y += a.vy * speed;

        if(a.x < 0 || a.x > 95) a.vx *= -1;

        let flying = ['eagle','owl','bee','butterfly'].includes(a.type);

        if(flying){
            if(a.y < 0 || a.y > 45) a.vy *= -1;
        } else {
            if(a.y < 60 || a.y > 95) a.vy *= -1;
        }

        if(a.type === 'butterfly' || a.type === 'bee'){
            a.y += Math.sin(Date.now()/200) * 0.2;
        }

        a.el.style.transform = a.vx > 0 ? 'scaleX(-1)' : 'scaleX(1)';

        update(a);
    });
}, 50);
</script>

</body>
</html>
