<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Lake - Explore</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:sans-serif;
}

/* 🌊 BACKGROUND */
.explore-page{
    background: linear-gradient(to top,#003049,#00c6ff);
}

/* 🌊 LAKE */
#lake{
    position:absolute;
    bottom:0;
    width:100%;
    height:60%;
    background: linear-gradient(to top,#001f33,#0077be,#00c6ff);
    border-top-left-radius:50% 20%;
    border-top-right-radius:50% 20%;
}

/* WORLD */
#lakeWorld{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* 🐟 FISH */
.fish{
    position:absolute;
    font-size:40px;
    transition: all 8s linear;
}

/* 🌊 MOVING ANIMALS */
.sea-life-move{
    position:absolute;
    font-size:45px;
    transition: all 8s linear;
}

/* 🌿 STATIC */
.sea-life-static{
    position:absolute;
    font-size:45px;
}

/* 🌿 PLANTS */
#waterPlants{
    position:absolute;
    bottom:0;
    width:100%;
    height:60%;
}

.water-plant{
    position:absolute;
    font-size:40px;
    animation:sway 5s ease-in-out infinite;
}

@keyframes sway{
    0%{transform:rotate(-4deg);}
    50%{transform:rotate(4deg);}
    100%{transform:rotate(-4deg);}
}

/* 🌧️ RAIN */
.drop{
    position:absolute;
    top:-20px;
    width:2px;
    height:15px;
    background:white;
    animation:fall 1s linear forwards;
}

@keyframes fall{
    from { transform: translateY(0); opacity:1; }
    to { transform: translateY(100vh); opacity:0; }
}

/* ❄️ SNOW */
.snow{
    position:absolute;
    top:-20px;
    font-size:18px;
    animation:snowFall 3s linear forwards;
}

@keyframes snowFall{
    from { transform: translateY(0); opacity:1; }
    to { transform: translateY(100vh); opacity:0; }
}

/* ☀️ SUN */
#sun{
    position:absolute;
    top:40px;
    right:50px;
    width:80px;
    height:80px;
    background:yellow;
    border-radius:50%;
    box-shadow:0 0 40px yellow;
}

/* BUTTONS */
.controls{
    position:absolute;
    top:10px;
    right:10px;
}

button{
    margin:3px;
    padding:8px 12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#ff9ecf,#ff6ec7);
    color:white;
}
</style>
</head>

<body class="explore-page">

<div id="lakeWorld">
    <div id="lake"></div>
    <div id="sun"></div>
    <div id="rain"></div>
</div>

<div id="waterPlants"></div>

<div class="controls">

<button onclick="addFish()">🐟 Fish</button>

<button onclick="addStatic('🪸')">🪸 Caracol</button>
<button onclick="addStatic('🪷')">🪷 Lotus</button>

<button onclick="addMove('🐬')">🐬 Dolphin</button>
<button onclick="addMove('🐋')">🐋 Whale</button>
<button onclick="addMove('🪼')">🪼 Medusa</button>

<button onclick="addPlant()">🌿 Plant</button>

<button onclick="toggleRain()">🌧️ Rain</button>
<button onclick="toggleSnow()">❄️ Snow</button>

<a href="index.html"><button>🏠 Home</button></a>

</div>

<script>

/* 🐟 FISH */
function addFish(){
    const world=document.getElementById("lakeWorld");

    let f=document.createElement("div");
    f.className="fish";
    f.innerHTML="🐠";

    f.style.left="100%";
    f.style.top=(60+Math.random()*25)+"%";

    world.appendChild(f);

    setTimeout(()=>{
        f.style.transition="all 8s linear";
        f.style.left="-10%";
    },100);
}

/* 🪸🪷 STATIC */
function addStatic(type){
    const world=document.getElementById("lakeWorld");

    let s=document.createElement("div");
    s.className="sea-life-static";
    s.innerHTML=type;

    s.style.left=Math.random()*100+"%";
    s.style.top=(60+Math.random()*25)+"%";

    world.appendChild(s);
}

/* 🐬🐋🪼 MOVING */
function addMove(type){
    const world=document.getElementById("lakeWorld");

    let a=document.createElement("div");
    a.className="sea-life-move";
    a.innerHTML=type;

    a.style.left="100%";
    a.style.top=(60+Math.random()*25)+"%";

    world.appendChild(a);

    setTimeout(()=>{
        a.style.transition="all 8s linear";
        a.style.left="-10%";
    },100);
}

/* 🌿 PLANTS */
function addPlant(){
    const c=document.getElementById("waterPlants");

    let p=document.createElement("div");
    p.className="water-plant";
    p.innerHTML="🌿";

    p.style.left=Math.random()*100+"%";
    p.style.bottom=Math.random()*20+"%";

    c.appendChild(p);
}

/* 🌧️ RAIN (REAL FIXED) */
function toggleRain(){
    const r=document.getElementById("rain");
    r.innerHTML="";

    let interval=setInterval(()=>{
        let d=document.createElement("div");
        d.className="drop";
        d.style.left=Math.random()*100+"%";

        r.appendChild(d);

        setTimeout(()=> d.remove(),1000);
    },80);

    setTimeout(()=>{
        clearInterval(interval);
        r.innerHTML="";
    },3000);
}

/* ❄️ SNOW (REAL FIXED) */
function toggleSnow(){
    const world=document.getElementById("lakeWorld");

    let interval=setInterval(()=>{
        let s=document.createElement("div");
        s.className="snow";
        s.innerHTML="❄️";
        s.style.left=Math.random()*100+"%";

        world.appendChild(s);

        setTimeout(()=> s.remove(),3000);
    },150);

    setTimeout(()=>{
        clearInterval(interval);
    },3000);
}

</script>

</body>
</html>
